<div style="min-height:100vh; background:#f4f6fb; display:flex; align-items:center; justify-content:center; font-family:'Segoe UI',sans-serif;">
  <div style="width:100%; max-width:450px; background:white; border-radius:18px; overflow:hidden; box-shadow:0 10px 30px rgba(37,99,235,0.15);">
    <div style="background:linear-gradient(135deg,#1a2a6c 0%,#2563eb 60%,#38bdf8 100%); padding:36px;">
      <p style="margin:0; color:rgba(255,255,255,.7); text-transform:uppercase; letter-spacing:.08em; font-size:.85rem;">Projektmanager</p>
      <h1 style="margin:8px 0 0 0; color:white; font-size:2rem; font-weight:700;">Willkommen zurück</h1>
      <p style="margin:10px 0 0 0; color:rgba(255,255,255,.75);">Melden Sie sich an, um auf Ihre Projekte und Aufgaben zuzugreifen.</p>
    </div>

    <div style="padding:32px;">

      <div style="display:flex; flex-direction:column; gap:16px;">
        <input
          type="email"
          [(ngModel)]="email"
          placeholder="E-Mail"
          style="padding:14px 16px; border:1px solid #dbe4f0; border-radius:10px; font-size:.95rem; outline:none;">

        <input
          type="password"
          [(ngModel)]="password"
          placeholder="Passwort"
          style="padding:14px 16px; border:1px solid #dbe4f0; border-radius:10px; font-size:.95rem; outline:none;">

        <button
          (click)="login()"
          style="background:#2563eb; color:white; border:none; padding:14px; border-radius:10px; font-weight:600; cursor:pointer; font-size:.95rem;">
          Anmelden
        </button>
      </div>

      <div style="display:flex; align-items:center; margin:24px 0;">
        <div style="height:1px; background:#e2e8f0; flex:1;"></div>
        <span style="padding:0 12px; color:#94a3b8; font-size:.85rem;">ODER</span>
        <div style="height:1px; background:#e2e8f0; flex:1;"></div>
      </div>

      <div style="display:flex; flex-direction:column; gap:12px;">
        <button
          (click)="loginWithGoogle()"
          style="background:white; border:1px solid #dbe4f0; padding:13px; border-radius:10px; cursor:pointer; font-weight:600;">
          Mit Google anmelden
        </button>

        <button
          (click)="loginWithGithub()"
          style="background:#111827; color:white; border:none; padding:13px; border-radius:10px; cursor:pointer; font-weight:600;">
          Mit Github anmelden
        </button>
      </div>

      <div style="margin-top:24px; text-align:center;">
        <a routerLink="/register" style="color:#2563eb; text-decoration:none; font-weight:600;">Account erstellen</a>
      </div>
    </div>
  </div>
</div>
